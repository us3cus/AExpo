name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: vps
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -la .output/public || echo "No .output/public directory"
          find .output -type f | head -20 || echo "No .output directory"
          echo "Looking for index.html:"
          find .output -name "index.html" || echo "No index.html found"
          echo "Content of .output/public:"
          ls -la .output/public/ 2>/dev/null || echo "Cannot list .output/public"
      
      - name: Create deployment archive
        run: |
          cd .output/public
          tar -czf ../../deploy.tar.gz .
          cd ../..
          echo "Archive created:"
          tar -tzf deploy.tar.gz | head -20
      
      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ vars.VPS_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp/"
          overwrite: true
      
      - name: Extract and set permissions
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ vars.VPS_PORT || 22 }}
          script: |
            echo "Extracting files..."
            sudo mkdir -p /var/www/temten.me
            cd /var/www/temten.me
            sudo tar -xzf /tmp/deploy.tar.gz
            sudo rm /tmp/deploy.tar.gz
            
            echo "Files extracted:"
            ls -la /var/www/temten.me/ | head -20
            
            echo "Checking for index.html:"
            if [ -f "/var/www/temten.me/index.html" ]; then
              echo "✅ index.html found!"
            else
              echo "❌ index.html NOT found!"
              find /var/www/temten.me -name "index.html"
            fi
            
            echo "Setting permissions..."
            sudo chown -R www-data:www-data /var/www/temten.me
            sudo chmod -R 755 /var/www/temten.me
            sudo find /var/www/temten.me -type f -exec chmod 644 {} \;
            
            echo "Reloading web server..."
            sudo systemctl reload nginx || sudo systemctl reload apache2 || true
            
            echo "✅ Deployment completed!"
