name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: vps
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -la .output/public || echo "No .output/public directory"
          find .output -type f | head -20 || echo "No .output directory"
      
      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ vars.VPS_PORT || 22 }}
          source: ".output/public/"
          target: "/var/www/temten.me"
          strip_components: 2
          rm: false
          overwrite: true
      
      - name: Set correct permissions and restart
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ vars.VPS_PORT || 22 }}
          script: |
            cd /var/www/temten.me
            sudo chown -R www-data:www-data .
            sudo chmod -R 755 .
            sudo find . -type f -exec chmod 644 {} \;
            sudo systemctl reload nginx || sudo systemctl reload apache2 || true
            echo "Deployment completed. Files in /var/www/temten.me:"
            ls -la /var/www/temten.me | head -10
