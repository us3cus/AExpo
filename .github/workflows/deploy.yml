name: Deploy to VPS (SSR)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: vps
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project for SSR
        run: npm run build
        env:
          NITRO_PRESET: node-server
      
      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -la .output || echo "No .output directory"
          echo "Server entry point:"
          ls -la .output/server/index.mjs 2>/dev/null || echo "No server entry found"
      
      - name: Create deployment archive
        run: |
          tar -czf deploy.tar.gz .output package.json package-lock.json ecosystem.config.cjs
          echo "Archive created:"
          tar -tzf deploy.tar.gz | head -20
      
      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ vars.VPS_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp/"
          overwrite: true
      
      - name: Extract and restart application
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ vars.VPS_PORT || 22 }}
          script: |
            echo "Preparing deployment directory..."
            sudo mkdir -p /var/www/temten.me
            cd /var/www/temten.me
            
            echo "Extracting files..."
            sudo tar -xzf /tmp/deploy.tar.gz
            sudo rm /tmp/deploy.tar.gz
            
            echo "Files extracted:"
            ls -la /var/www/temten.me/
            
            echo "Checking server entry point..."
            if [ -f "/var/www/temten.me/.output/server/index.mjs" ]; then
              echo "✅ Server entry point found"
            else
              echo "❌ Server entry point NOT found!"
              exit 1
            fi
            
            echo "Setting permissions..."
            sudo chown -R $USER:$USER /var/www/temten.me
            
            echo "Checking Node.js and PM2..."
            node --version || { echo "Node.js not installed!"; exit 1; }
            npm --version || { echo "npm not installed!"; exit 1; }
            
            echo "Installing/updating PM2..."
            command -v pm2 || sudo npm install -g pm2
            
            echo "Creating logs directory..."
            mkdir -p /var/www/temten.me/logs
            
            echo "Stopping old process..."
            pm2 stop temten-app || true
            pm2 delete temten-app || true
            
            echo "Starting application with PM2..."
            cd /var/www/temten.me
            pm2 start ecosystem.config.cjs
            pm2 save
            
            echo "Waiting for app to start..."
            sleep 5
            
            echo "PM2 status:"
            pm2 list
            
            echo "Checking if app is running on port 3000..."
            if curl -f http://127.0.0.1:3000 > /dev/null 2>&1; then
              echo "✅ App is responding on port 3000"
            else
              echo "❌ App is NOT responding on port 3000"
              echo "Recent logs:"
              pm2 logs temten-app --lines 100 --nostream
              exit 1
            fi
            
            echo "Last 50 lines of logs:"
            pm2 logs temten-app --lines 50 --nostream
            
            echo "✅ Deployment completed!"
